name: Install uploaded forest ranger sprite sheet

on:
  push:
    branches: [main]
    paths:
      - 'art/characters/forest_ranger_source.png'
      - 'tools/install_forest_ranger.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: forest-ranger-install-main
  cancel-in-progress: false

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build transparent atlas and editor SpriteFrames
        run: |
          python -m pip install --quiet pillow
          python tools/install_forest_ranger.py
          test -s art/characters/forest_ranger.png
          grep -q 'attack_right' resources/animations/hero.tres
          grep -q 'scale = Vector2(0.68, 0.68)' scenes/base/player.tscn
      - name: Save native Godot asset changes to main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add art/characters/forest_ranger.png resources/animations/hero.tres scenes/base/player.tscn
          if git diff --cached --quiet; then echo 'Already installed'; exit 0; fi
          git commit -m 'Use forest ranger for Godot player in all four directions'
          git pull --rebase origin main
          git push origin HEAD:main
